<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workshop Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <h1>Developer Workshop Registration</h1>
        <form id="registration-form" action="/submit" method="POST">
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="experience">Experience Level:</label>
                <select id="experience" name="experience" required>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <p class="group-title">Workshop Track</p>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="frontend" name="track" value="frontend" required>
                        <label for="frontend">Frontend Web</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="backend" name="track" value="backend">
                        <label for="backend">Backend APIs</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="uiux" name="track" value="uiux">
                        <label for="uiux">UI/UX Design</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="radio-option">
                    <input type="checkbox" id="notifications" name="notifications">
                    <label for="notifications">Send me event updates</label>
                </div>
            </div>

            <button type="submit">Register Now</button>
        </form>
    </div>
</body>
</html>
